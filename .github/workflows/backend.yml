name: WatApi Backend CI

# Trigger workflow on push or pull request to main/master branches
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Use the latest Ubuntu virtual machine provided by GitHub
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone the repository code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Set up the requested .NET SDK version
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to '7.0.x' if you are using .NET 7

    # Step 3: Restore NuGet packages
    - name: Restore dependencies
      run: dotnet restore WatApi/WatApi.sln

    # Step 4: Compile the project in Release mode
    - name: Build project
      run: dotnet build WatApi/WatApi.sln --no-restore --configuration Release
